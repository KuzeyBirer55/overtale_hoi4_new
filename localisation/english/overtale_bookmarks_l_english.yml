l_english:
 EMERGENCE: "the Emergence"
 EMERGENCE_DESC: "The world will never be the same. Something supernatural and yet unexpected happened. The entire Sawatch Range is gone. The dissappearance started from the center of it: Mount Elbert. Then, it widespread. But when it dissappeared, it didn't bringed lava. It didn't bringed destruction neither. It bringed them..."
 
 EBT_EMERGENCE_DESC: "We have no idea who they are, how they manage to get in there, or, was they were always inside of it. We don't know why they did it. What we know is that they aren't invadors. They are people.
 NDV_EMERGENCE_DESC: "After the emergence, poor Moffat country found itself inside the newly formed plain. They are terrified, an the municapitalities there are trying to handle the situation."
 USA_EMERGENCE_DESC: "Poor America just faced it all :("
 
 #note: millenium_dawn's are shown at 2000 start and modern_day ones are shown at 2017 start
